name: dsh-lan-deployment

services:
  dsh:
    image: dsh-lan-deployment:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3080:8080"
    environment:
      - DEEPSEEK_API_KEY
    volumes:
      - ./data:/var/lib/dsh
      - ./workspace:/workspace
    restart: unless-stopped
    stop_grace_period: 15s
