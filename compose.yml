name: dsh-lan-deployment

services:
  dsh:
    image: dsh-lan-deployment:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3080:8080"
    cap_add:
      - NET_ADMIN
    environment:
      DSH_ADMIN_PASSWORD: ${DSH_ADMIN_PASSWORD:?请在 .env 中设置 DSH_ADMIN_PASSWORD}
    volumes:
      - ./data:/var/lib/dsh
    restart: unless-stopped
    stop_grace_period: 15s
