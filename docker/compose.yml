name: dsh-lan-deployment

services:
  dsh:
    image: dsh-lan-deployment:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3081:8080"
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
    env_file:
      - ../.env
    volumes:
      - ../data:/var/lib/dsh
    restart: unless-stopped
    stop_grace_period: 15s
