name: dsh-server-manager

services:
  dsm:
    image: dsh-server-manager:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3082:8080"
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
    env_file:
      - ../.env
    volumes:
      - ./data:/var/lib/dsh
    restart: unless-stopped
    stop_grace_period: 15s
